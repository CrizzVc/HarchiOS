# Hyprlock Configuration
# Basado en: https://github.com/mahaveergurjar/Hyprlock-Dots

# Incluir colores (se generan con Matugen)
include = ~/.config/skwd-wall-v2/matugen/templates/hyprlock-colors.conf

# Incluir el layout seleccionado
include = ~/.config/hyprlock/layouts/layout2.conf

# Configuración general
general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
    ignore_empty_input = false
}

# Fondo
background {
    path = ~/.config/skwd-wall-v2/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Campo de contraseña
input-field {
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = false
    dots_fade_time = 200
    fade_on_empty = true
    fade_timeout = 1000
    font_color = rgb(202, 216, 247)
    inner_color = rgb(94, 103, 136)
    outer_color = rgb(24, 27, 37)
    check_color = rgb(199, 152, 208)
    fail_color = rgb(234, 131, 157)
    fail_text = <i>Incorrect Password</i>
    fail_transition = 300
    capslock_color = rgb(240, 200, 120)
    capslock_text = <i>Caps Lock</i>
    bothlock_color = rgb(240, 200, 120)
    bothlock_text = <i>Caps + Num Lock</i>
    numlock_color = rgb(240, 200, 120)
    numlock_text = <i>Num Lock</i>
    invert_numlock = false
    swap_font_color = false
    position = 0, -20
    halign = center
    valign = center
}
