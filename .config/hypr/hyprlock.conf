# Hyprlock Configuration
# Nota: en hyprlang la directiva para incluir ficheros es `source =`
#       (`include =` se ignora silenciosamente y por eso antes no cargaba nada)

# Paleta de colores (wallbash / matugen)
source = ~/.config/hyprlock/colors.conf

# Configuracion general
general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
}

# Fondo
background {
    monitor =
    path = ~/.config/skwd-wall-v2/wallpaper.jpg
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# HORA (horas)
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $p1_accent_4_rgba
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 150
    font_family = Alfa Slab One
    position = 0, -250
    halign = center
    valign = top
    zindex = 5
}

# MINUTOS
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $primary_3_rgba
    shadow_size = 3
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.2
    font_size = 150
    font_family = Alfa Slab One
    position = 0, -420
    halign = center
    valign = top
    zindex = 5
}

# FECHA
label {
    monitor =
    text = cmd[update:1000] date +"%d %b %A"
    color = $p3_accent_6_rgba
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
    zindex = 5
}

# SALUDO
label {
    monitor =
    text = cmd[update:60000] echo "<i>Hola $USER :)</i>"
    color = $text_1_rgba
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -90
    halign = center
    valign = center
    zindex = 5
}

# Campo de contrasena
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $primary_8_rgba
    inner_color = $primary_7_rgba
    font_color = $text_1_rgba
    check_color = $p1_accent_4_rgba
    fail_color = rgb(234, 131, 157)
    fail_text = <i>Contrasena incorrecta</i>
    placeholder_text = <i>Contrasena</i>
    fade_on_empty = true
    fade_timeout = 2000
    hide_input = false
    position = 0, -470
    halign = center
    valign = center
    zindex = 20
}
